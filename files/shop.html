<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriManage - Seeds Shop</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f9f4; }
        .header { text-align: center; color: #2e7d32; margin-bottom: 30px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .product-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e0e0e0; }
        .product-card h3 { color: #333; margin: 10px 0; }
        .price-tag { font-size: 18px; font-weight: bold; color: #2e7d32; margin: 10px 0; }
        .original-price { text-decoration: line-through; color: #888; font-size: 14px; margin-right: 5px; }
        .buy-btn { background: #2e7d32; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; transition: background 0.2s; }
        .buy-btn:hover { background: #1b5e20; }
        #loading { text-align: center; font-size: 18px; color: #666; }
    </style>
</head>
<body>

<div class="header">
    <h2>🌱 High-Quality Seeds & Resources</h2>
    <p>ගොවීන් සඳහාම විශේෂයෙන් අඩු කරන ලද මිල ගණන් යටතේ ඉහළම ප්‍රමිතියේ බීජ වර්ග</p>
</div>

<div id="loading">Loading products...</div>

<!-- බීජ වර්ග ඔටෝමැටිකව ලෝඩ් වන Grid එක -->
<div class="product-grid" id="productGrid"></div>

<script src="shop.js"></script>
</body>
</html>
